version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: email_scheduler_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: mysqlpassword
      MYSQL_DATABASE: email_scheduler
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: email_scheduler_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: mysqlpassword
    ports:
      - "8080:80"
    depends_on:
      - mysql

  redis:
    image: redis:7-alpine
    container_name: email_scheduler_redis
    restart: always
    command: redis-server --appendonly yes --save 60 1
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
